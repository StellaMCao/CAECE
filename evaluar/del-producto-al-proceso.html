<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markmap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<style>
:root{--map-font:"Arial Narrow", "Aptos Narrow", "Roboto Condensed", Arial, sans-serif;--map-font-size:1em;--map-text:#17202a;--table-border:#d6dee8;--table-head:#eef2f6;--circle-radius:7px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fbfcfd;color:#17202a}header{align-items:center;background:#fff;border-bottom:1px solid #d6dee8;display:flex;gap:8px;justify-content:space-between;min-height:48px;padding:8px 12px}h1{font-size:16px;margin:0}button{background:transparent;border:1px solid #d6dee8;border-radius:6px;color:inherit;cursor:pointer;font:inherit;font-size:14px;min-height:32px;padding:0 10px}#mindmap{display:block;height:calc(100vh - 48px);width:100vw}.markmap-node circle{cursor:pointer;r:var(--circle-radius,7px) !important;stroke-width:2.2px !important;transition:r .15s ease,stroke-width .15s ease,fill .15s ease}.markmap-node circle:hover{r:calc(var(--circle-radius,7px) * 1.35) !important;stroke-width:3px !important}.markmap-foreign div{color:var(--map-text);font-family:var(--map-font);font-size:var(--map-font-size)}.markmap-foreign a{color:color-mix(in srgb,var(--map-text) 72%,#008cff)}.markmap-foreign img{border-radius:6px;max-height:180px;max-width:min(100%,420px);object-fit:contain}.markmap-foreign .media-image img{height:auto;max-height:none;max-width:100%;width:100%}.markmap-foreign audio{display:block;height:40px;min-width:260px;width:260px}.markmap-foreign .media-drive-audio{display:block;width:300px;height:82px;border:0;border-radius:10px;box-shadow:0 4px 6px -1px rgba(0,0,0,.08);overflow:hidden}.markmap-foreign .media-drive-img{display:block;border:0;border-radius:10px;box-shadow:0 4px 6px -1px rgba(0,0,0,.08);overflow:hidden;background:#f1f5f9}.markmap-foreign iframe:not(.media-drive-img):not(.media-drive-audio){border:0;border-radius:8px;display:block;height:78px;width:300px}.markmap-foreign .media-node{display:inline-block}.markmap-foreign .media-img-node,.markmap-foreign .media-audio-node{display:block;margin-top:4px}.markmap-foreign table{border-collapse:collapse;display:block;font-size:.82em;margin-top:6px;max-width:380px;overflow:hidden}.markmap-foreign th,.markmap-foreign td{border:1px solid var(--table-border);padding:4px 7px;text-align:left;vertical-align:top;white-space:nowrap}.markmap-foreign th{background:var(--table-head);font-weight:700}.hint{color:#64748b;font-size:12px}
</style>
</head>
<body>
<header><h1>Markmap</h1><div><button id="fit">Ajustar</button> <span class="hint">clic en círculos para desplegar/contraer</span></div></header>
<svg id="mindmap"></svg>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.min.js"></script>
<script>
const markdown = "---\ntitle: Síntesis del diseño metodológico\nmarkmap:\n  colorFreezeLevel: 2\n  color: \"#015231\"\n---\n\n\n\n# **Evaluar para aprender a investigar: del producto al proceso**\n\n## 1. Parte de una necesidad situada\n- **Contexto:** 2.º año de Enfermería - Introducción a la Metodología de la Investigación en Salud\n- **Problema:** el informe terminado no muestra todas las decisiones, dificultades y reformulaciones *(Anijovich, 2018)*\n- **Propósito:** hacer visible la trayectoria y acompañar la construcción del conocimiento *(Rodríguez Gómez e Ibarra Sáiz, 2016)*\n\n## 2. Hace coherentes la enseñanza y la evaluación\n- **Enseñanza contextualizada:** proyectos vinculados con problemas auténticos del campo de la salud *(Díaz Barriga, 2005; Velásquez y Frola, 2023)*\n- **Lo enseñado se pone en práctica:** formular problemas, buscar antecedentes, diseñar y comunicar una investigación *(Camilloni, 1998: validez de constructo)*\n- **Evalúa dos dimensiones:** contenidos disciplinares y decisiones metodológicas; saber, saber hacer y revisar cómo se aprende *(Rodríguez Gómez e Ibarra Sáiz, 2016; Castillo Arredondo y Cabrerizo Diago, 2010)*\n- **Aprender con otros:** documentos compartidos y participación individual en un trabajo colectivo *(Rochera Villach et al., 2020)*\n\n## 3. Reconoce las dos caras del error\n- **Evaluación frágil: el error como obstáculo** *(contraste inspirado en Taleb)*\n  - El error se penaliza y puede cerrar la posibilidad de revisión *(Anijovich y González, 2011)*\n  - Las etiquetas y expectativas docentes pueden condicionar las oportunidades de aprender: **efecto Pigmalión** *(Anijovich y González, 2011)*\n  - **Riesgo:** ocultar las dificultades en vez de analizarlas \n- **Evaluación antifrágil: el error como oportunidad de mejora** *(Taleb)*\n  - Los errores revelan hipótesis, decisiones y necesidades de acompañamiento *(Anijovich y González, 2011; Allal)*\n  - Los sesgos y las referencias inventadas por la IA se convierten en ejercicios de contrastación \n  - **Secuencia:** error → devolución → revisión → mejora documentada *(Anijovich, 2018; Hattie y Timperley, 2007)*\n  - Los errores recurrentes también pueden orientar ajustes en la enseñanza \n\n  - **Condición:** el error no mejora por sí solo; importa lo que hacemos con él \n\n## 4. Organiza una trayectoria con evidencias\n- **Eje del sistema:** portafolio digital con borradores, fuentes, versiones, comentarios y reflexiones *(Rodríguez Gómez e Ibarra Sáiz, 2016; Anijovich, 2018)*\n- **1.er bimestre:** delimitar el problema → diagnóstico y lista de cotejo\n- **2.º bimestre:** analizar antecedentes y respuestas de IA → rúbrica y contraste de fuentes\n- **3.er bimestre:** diseñar la metodología → revisiones y protocolo S.E.R.\n- **4.º bimestre:** presentar el informe y defender el proyecto → simposio de investigadores\n- **Sentido de la secuencia:** valorar cómo se construye el trabajo, no solo cómo termina *(Anijovich, 2018)*\n\n## 5. Diferencia marco y guía de uso\n- **Marco de uso docente:** propósitos, evidencias, criterios, instrumentos, seguimiento y ponderaciones *(Camilloni, 1998; Alonso Díaz y Blázquez Entonado, 2016)*\n- **Guía de uso estudiantil:** consignas, etapas, rúbricas conocidas desde el inicio y responsabilidades *(Velásquez y Frola, 2023; Anijovich y González, 2011)*\n- **Tres miradas:** heteroevaluación docente, autoevaluación y coevaluación entre pares *(Anijovich y González, 2011)*\n- **Tecnologías con función pedagógica:** Drive, aula virtual e historiales de edición para documentar procesos *(Alonso Díaz y Blázquez Entonado, 2016; Rochera Villach et al., 2020)*\n\n## 6. Acompaña, retroalimenta y acredita\n- **Feed up:** ¿hacia dónde vamos? → propósitos y criterios *(Hattie y Timperley, 2007)*\n- **Feedback:** ¿cómo vamos? → logros, dificultades y evidencias *(Hattie y Timperley, 2007; Anijovich, 2018)*\n- **Feedforward:** ¿qué hacemos ahora? → decisiones de mejora *(Hattie y Timperley, 2007)*\n- **Protocolo S.E.R.:** seguir haciendo · empezar a hacer · reformular \n- **Distinción necesaria:** evaluación para aprender y calificación para acreditar *(Camilloni, 1998)*\n- **Ponderación del proyecto:** proceso 40 % · informe y presentación finales 60 %\n\n## 7. Puede transformar percepciones y transferirse\n- **Percepciones:** de la evaluación como amenaza o filtro hacia una oportunidad de aprender *(Anijovich y González, 2011; Anijovich, 2018)*\n- **Transparencia y confianza:** criterios visibles y sentido comprensible de las tareas *(Camilloni, 1998: validez manifiesta)*\n- **Transferibilidad:** mantener la arquitectura y adaptar problemas, fuentes y criterios a otras disciplinas *(Camilloni, 1998; Díaz Barriga, 2005)*\n- **Desafíos:** tiempo docente, participación sostenida y retroalimentación oportuna *(Rochera Villach et al., 2020)*\n- **Alcance:** son efectos esperados del diseño, no resultados empíricos ya comprobados\n\n## 8. Conclusión: una evaluación que también aprende\n- **Del error como veredicto al error como evidencia:** las dificultades dejan de cerrar el recorrido y pueden orientar nuevas decisiones *(Anijovich y González, 2011; Anijovich, 2018)*\n- **Del producto aislado a la trayectoria visible:** el portafolio permite reconocer, fundamentar y documentar las transformaciones del proyecto *(Rodríguez Gómez e Ibarra Sáiz, 2016)*\n- **Doble aprendizaje:** los estudiantes revisan cómo investigan y los docentes pueden revisar cómo enseñan *(proyección pedagógica del sistema)*\n- **Horizonte antifrágil:** no evitar todo error, sino crear condiciones para aprender de él y mejorar sin confundir el error con el fracaso *(Taleb; aplicación pedagógica)*\n- **No evaluamos solamente lo aprendido; evaluamos para que sea posible seguir aprendiendo** \n";
const settings = {"level":1,"foldMode":"strict","palette":"forest","font":"narrow","textSize":1,"textSizeRules":{"1":1.36,"2":1.18,"3":1.1,"4":1},"textColor":"auto","lineWidth":2,"widthRules":{"1":300,"2":610,"3":310,"4":310},"spacingHorizontal":92,"spacingVertical":19,"duration":420,"theme":"light","circleRadius":7};
const palettes = {"classic":["#1f77b4","#ff7f0e","#2ca02c","#d62728","#9467bd","#8c564b","#e377c2","#17becf"],"ocean":["#005f73","#0a9396","#94d2bd","#3a86ff","#4361ee","#4895ef"],"forest":["#386641","#6a994e","#a7c957","#2d6a4f","#40916c","#74c69d"],"sunset":["#9b2226","#bb3e03","#ca6702","#ee9b00","#ae2012","#e76f51"],"neon":["#ff007f","#00f0ff","#ff00ff","#39ff14","#ffff00","#7b2cbf"],"pastel":["#b388ff","#ff8a80","#ff80ab","#a7ffeb","#82b1ff","#ffe082"],"vintage":["#e29578","#dd6e42","#e8c547","#4d9078","#8f2d56","#b5e2fa"],"grape":["#4a154b","#6b11ff","#b388ff","#d500f9","#ea80fc"],"candy":["#ff1744","#00e5ff","#ffea00","#00e676","#ff9100","#d500f9"],"mono":["#111827","#374151","#4b5563","#6b7280","#0f766e"]};
const defaultWidthRules = {"1":420,"2":360,"3":320,"4":280};
const defaultTextSizeRules = {"1":1.18,"2":1.08,"3":1,"4":0.94,"5":0.9};
const api = window.markmap;
const svg = document.querySelector('#mindmap');
function colorFor(name){const colors=palettes[name]||palettes.classic;return node=>colors[Math.max(0,(node.state?.depth||1)-1)%colors.length];}
function sanitizeWidthRules(rules){const next={};Object.entries(rules||{}).forEach(([level,width])=>{const numericLevel=Math.max(1,Math.round(Number(level)));const numericWidth=Math.max(80,Math.min(1200,Math.round(Number(width))));if(Number.isFinite(numericLevel)&&Number.isFinite(numericWidth))next[numericLevel]=numericWidth});return Object.keys(next).length?next:{...defaultWidthRules}}
function sanitizeTextSizeRules(rules){const next={};Object.entries(rules||{}).forEach(([level,size])=>{const numericLevel=Math.max(1,Math.round(Number(level)));const numericSize=Math.max(.4,Math.min(2.4,Number(size)));if(Number.isFinite(numericLevel)&&Number.isFinite(numericSize))next[numericLevel]=Math.round(numericSize*100)/100});return Object.keys(next).length?next:{...defaultTextSizeRules}}
function widthForDepth(rules,depth){const sanitized=sanitizeWidthRules(rules);const levels=Object.keys(sanitized).map(Number).sort((a,b)=>a-b);const matched=levels.filter(level=>level<=depth).pop()||levels[0];return sanitized[matched]}
function widthCssFor(rules){return Array.from({length:32},(_,i)=>{const depth=i+1;const width=widthForDepth(rules,depth);return '.markmap-node[data-depth="'+depth+'"] .markmap-foreign > div{width:'+width+'px;max-width:'+width+'px}\n.markmap-node[data-depth="'+depth+'"] .markmap-foreign > div > div{max-width:'+width+'px;white-space:normal;overflow-wrap:anywhere}'}).join('\n')}
function textSizeForDepth(rules,depth){const sanitized=sanitizeTextSizeRules(rules);const levels=Object.keys(sanitized).map(Number).sort((a,b)=>a-b);const matched=levels.filter(level=>level<=depth).pop()||levels[0];return sanitized[matched]}
function textSizeCssFor(rules){return Array.from({length:32},(_,i)=>{const depth=i+1;return '.markmap-node[data-depth="'+depth+'"] .markmap-foreign > div{font-size:calc(var(--map-font-size) * '+textSizeForDepth(rules,depth)+')}'}).join('\n')}
function cloneWithoutFold(node){const payload=node.payload?{...node.payload}:undefined;if(payload)delete payload.fold;return {...node,payload,children:node.children?.map(cloneWithoutFold)||[]}}
function cloneWithLevelFold(node,visibleLevel,depth=1){const payload=node.payload?{...node.payload}:{};delete payload.fold;if(visibleLevel>=0&&depth>=visibleLevel+1&&node.children?.length)payload.fold=1;return {...node,payload:Object.keys(payload).length?payload:undefined,children:node.children?.map(child=>cloneWithLevelFold(child,visibleLevel,depth+1))||[]}}
function prepareRoot(root){return settings.foldMode==='memory'?cloneWithoutFold(root):cloneWithLevelFold(root,settings.level??-1)}
function configureMapLinks(){svg.querySelectorAll('.markmap-foreign a').forEach(link=>{if(!link.getAttribute('href')?.startsWith('#')){link.setAttribute('target','_blank');link.setAttribute('rel','noopener noreferrer')}if(link.dataset.mapLinkReady)return;link.dataset.mapLinkReady='1';['pointerdown','mousedown','click','dblclick'].forEach(name=>link.addEventListener(name,event=>event.stopPropagation()))})}
const transformer = new api.Transformer();
function lineWidth(){return Math.max(.5,settings.lineWidth||1.6)}
const mm = api.Markmap.create(svg, { autoFit: false, duration: settings.duration ?? 180, initialExpandLevel: -1, color: colorFor(settings.palette), lineWidth, maxWidth: 0, style: () => widthCssFor(settings.widthRules)+'\n'+textSizeCssFor(settings.textSizeRules), spacingHorizontal: settings.spacingHorizontal ?? 78, spacingVertical: settings.spacingVertical ?? 7 });
async function draw() {
  const { root } = transformer.transform(markdown);
  await mm.setData(prepareRoot(root), { duration: settings.duration ?? 180, initialExpandLevel: -1, color: colorFor(settings.palette), lineWidth, maxWidth: 0, style: () => widthCssFor(settings.widthRules)+'\n'+textSizeCssFor(settings.textSizeRules), spacingHorizontal: settings.spacingHorizontal ?? 78, spacingVertical: settings.spacingVertical ?? 7 });
  configureMapLinks();
  await mm.fit();
}
document.querySelector('#fit').addEventListener('click', () => mm.fit());
window.addEventListener('resize', () => mm.fit());
draw();
</script>
</body>
</html>
