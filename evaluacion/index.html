  <style>

<body>
  
  <div id="capture-container">
    <div class="glass-panel title-banner">

<script type="text/markdown" id="markdown-content">

# <span class="root-title">🎓 La evaluación<br>educativa</span><br/><span onmousedown="playAudio('./img/0.mp3', this, event)" class="play-btn">🔊 Escuchar</span>

## 1️⃣ ¿Qué es y cuál es su relación con enseñanza-aprendizaje?<br/><span onmousedown="playAudio('./img/1.mp3', this, event)" class="play-btn">🔊 Escuchar</span>

### Proceso dinámico
- 🖼️ <img src="./img/1.png" width="350" height="287"><br/><small><i>Dimensión contextual y dinámica.</i></small>

### Concepto
- *Según:*
  - **Castillo Arredondo y Cabrerizo Diago (2010):** proceso **dinámico, abierto y contextualizado**.
  - **Tenbrink (1988):** tres operaciones:
    - obtener información rigurosa
    - formular juicios de valor
    - tomar decisiones

### Relación enseñanza-aprendizaje
- *Se entiende como:*
  - **Álvarez Méndez (1993):** parte constitutiva del aprendizaje.
  - **Celman (1998):** herramienta de conocimiento para comprender y mejorar.
  - **Castillo Arredondo y Cabrerizo Diago (2010):** punto de encuentro didáctico.
  - **Litwin (1998):** atribuir valor en situaciones concretas.
  - **Camilloni (1998):** programa para guiar el aprendizaje y mejorar la enseñanza.

### Idea central
- *En síntesis:*
  - ❌ **No es un apéndice**.
  - ✅ Es parte **constitutiva e indisociable**.
  - Permite: regular el proceso, orientar decisiones y dialogar pedagógicamente.

## 2️⃣ ¿Para qué y por qué evaluar?<br/><span onmousedown="playAudio('./img/2.mp3', this, event)" class="play-btn">🔊 Escuchar</span>

### Por qué (funciones)
- *Se divide en:*
  - 🧭 **Diagnóstica:** conocer el punto de partida del alumno.
  - ⚙️ **Formativa/reguladora:** acompañar y ajustar durante el proceso.
  - 🏁 **Sumativa:** valorar los resultados al cierre.

### Para qué (finalidades)
- Tomar decisiones pedagógicas.
- Adecuar la enseñanza a necesidades y ritmos.
- Promover aprendizajes a partir del error.
- Calificar, facilitar la promoción y acreditar saberes.
- **Transformar la evaluación en herramienta de conocimiento.**

## 3️⃣ Toma de decisión y constructivismo<br/><span onmousedown="playAudio('./img/3.mp3', this, event)" class="play-btn">🔊 Escuchar</span>

### Fundamentos
- 🖼️ <img src="./img/3.png" width="350" height="321"><br/><small><i>Integración constructivista.</i></small>

### Postulado constructivista
- *Implica:*
  - **Allal (1980):** comprender el funcionamiento cognitivo frente a la tarea.
  - **Díaz Barriga (2005):** coherencia total
    - entre enseñar, aprender y evaluar.

### 💡 El error formativo
- **Allal (1980):** no son fracasos, sino indicadores de estrategias y obstáculos.
- Permiten observar cómo piensa el alumno y qué ayuda necesita.

### Evaluación dinámica
- Interacción profesor-alumno observando avances con ayuda.
- **Vygotsky:** actuar sobre la Zona de Desarrollo Próximo (ZDP).

### Decisión pedagógica
- El docente interviene durante el proceso brindando pistas y andamiajes.
- Favorece la modificabilidad, autonomía y disponibilidad para aprender.

## 4️⃣ Enfoque de la materia<br/><span onmousedown="playAudio('./img/4.mp3', this, event)" class="play-btn">🔊 Escuchar</span>

### 🌍 Evaluación auténtica
- Tareas complejas, activas y cercanas a la vida real.
- Valorar desempeños en contextos significativos (Díaz Barriga, 2005).

### 🧩 Por competencias
- 🖼️ <img src="./img/2.png" width="350" height="164"><br/><small><i>Saberes integrados.</i></small>
- Desempeño integral:
  - 🧠 **Saber:** conceptos e información.
  - 🛠️ **Saber hacer:** habilidades y procedimientos.
  - ❤️ **Saber ser:** actitudes y valores.
  - 🔄 **Saber aprender:** metacognición y autonomía.

### 🌱 Evaluación formadora
- **Jorba y Sanmartí (2000):** el alumno aprende a regular su propio proceso.
- Favorece la autoevaluación, metacognición y mejora autónoma.

## 5️⃣ Preguntas clásicas<br/><span onmousedown="playAudio('./img/5.mp3', this, event)" class="play-btn">🔊 Escuchar</span>

### 🎯 ¿Qué evaluar?
- Competencias básicas, conocimientos, habilidades, actitudes, procesos y resultados.

### 🛠️ ¿Cómo evaluar?
- Metodologías variadas, cuantitativas y cualitativas.
- Fomentar la creatividad y la reflexión sobre el proceso.

### ⏱️ ¿Cuándo evaluar?
- **Antes:** inicial / diagnóstica.
- **Durante:** procesual / formativa / reguladora.
- **Final:** final / sumativa.

### 📋 ¿Con qué? (instrumentos)
- *A través de:*
  - Rúbricas o matrices de valoración (Ahumada, 2003).
  - Portafolios de evidencias (Airasian, 2001; McKeachie, 1999).
  - Listas de cotejo, producciones escritas, proyectos y trabajo colaborativo.

### 👥 ¿Quién evalúa?
- *Según el agente:*
  - **Heteroevaluación:** del docente al alumno.
  - **Autoevaluación:** el propio alumno analiza su aprendizaje.
  - **Coevaluación:** los pares valoran procesos o producciones.

## 6️⃣ Idea integradora<br/><span onmousedown="playAudio('./img/6.mp3', this, event)" class="play-btn">🔊 Escuchar</span>

### Evaluar para comprender, decidir y mejorar
- **Articulación:** da sentido al aprendizaje, no es solo medir o calificar.
- **Paradigma docente:**
  - Rol de formador-entrenador (Castillo Arredondo y Cabrerizo Diago, 2010).
  - Herramienta de conocimiento y reflexión (Celman, 1998).
- **Error formativo:** motor de aprendizaje y autorregulación.

### Síntesis final
- Retroalimenta al alumno para la mejora continua.
- Aporta información para actuar en la Zona de Desarrollo Próximo.
- **Cierre:** *guiar el camino con linterna, no solo contar pasos al final.*

## 7️⃣ Mirada personal<br/><span onmousedown="playAudio('./img/7.mp3', this, event)" class="play-btn">🔊 Escuchar</span>

### 🔍 El *corpus delicti* evaluativo
- 🖼️ <img src="./img/corpus%20delicti.jpg" width="300" height="153"><br/><small><i>Mi primera evaluación (tal como apareció en <a href="https://padlet.com/mpaz85/nos-presentamos-nvle6d91na42b3dc/wish/kxodWG26Nz0bZgP7" target="_blank" style="color: #2980b9; text-decoration: underline;">mi presentación</a> para esta materia)</i></small>

### Reflexión final
- 🔨 **No es un martillo:** que cae sobre el error.
- 🔦 **Es una linterna:** que permite ver mejor el camino.
- Si solo da nota: califica sin enseñar.
- Con retroalimentación: ayuda a comprender qué pasó, qué se necesita y cómo seguir.
</script>

  <script>
    let mm;
    let originalRoot; // stored as a plain JS object (JSON-safe copy of the parsed tree)
    
    // Audio Player logic
    let currentAudio = null;
    let currentBtn = null;

    window.playAudio = function(src, btnElement, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation(); // Evita que markmap expanda/contraiga el nodo al hacer clic en el botón
      }
      
      // Si se hace clic en el mismo botón que está sonando, pausarlo
      if (currentAudio && currentBtn === btnElement && !currentAudio.paused) {
        currentAudio.pause();
        btnElement.classList.remove('playing');
        btnElement.innerHTML = '🔊 Escuchar';
        return;
      }

      // Detener audio anterior si existe
      if (currentAudio) {
        currentAudio.pause();
        if (currentBtn) {
          currentBtn.classList.remove('playing');
          currentBtn.innerHTML = '🔊 Escuchar';
        }
      }

      // Reproducir nuevo
      currentAudio = new Audio(src);
      currentBtn = btnElement;
      
      currentBtn.classList.add('playing');
      currentBtn.innerHTML = '⏸️ Pausar';
      
      currentAudio.play().catch(e => {
        console.error("Error reproduciendo audio:", e);
        currentBtn.classList.remove('playing');
        currentBtn.innerHTML = '❌ Error';
      });

      currentAudio.onended = () => {
        currentBtn.classList.remove('playing');
        currentBtn.innerHTML = '🔊 Escuchar';
        currentAudio = null;
        currentBtn = null;
      };
    };

    // Fullscreen Logic
    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error al intentar entrar en pantalla completa: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    };
    
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('btnFullscreen');
      if (document.fullscreenElement) {
        btn.innerHTML = '↙️ Salir de Pantalla Completa';
      } else {
        btn.innerHTML = '🖥️ Pantalla Completa';
      }
    });

    // Zoom Logic
    window.zoomIn = function() {
      if (mm && mm.zoom) {
        const svg = d3.select('#markmap');
        mm.zoom.scaleBy(svg.transition().duration(300), 1.2);
      }
    };
    
    window.zoomOut = function() {
      if (mm && mm.zoom) {
        const svg = d3.select('#markmap');
        mm.zoom.scaleBy(svg.transition().duration(300), 0.8);
      }
    };
    
    window.fitMap = function() {
      if (mm) {
        mm.fit();
      }
    };

    // Apply fold states recursively on a deep clone - never mutates the original
    function deepCloneWithFold(node, foldLevel, currentLevel = 0) {
      return {
        content: node.content,
        depth:   node.depth,
        payload: Object.assign({}, node.payload, { fold: currentLevel >= foldLevel ? 1 : 0 }),
        children: Array.isArray(node.children)
          ? node.children.map(c => deepCloneWithFold(c, foldLevel, currentLevel + 1))
          : []
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      const markdown = document.getElementById('markdown-content').textContent;
      const { Markmap, Transformer, deriveOptions } = window.markmap;

      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);

      // Store a safe JSON copy of the original tree (before any fold mutations)
      originalRoot = JSON.parse(JSON.stringify(root));

      // deriveOptions converts color arrays → color functions, numbers, booleans, etc.
      const frontmatter = root.payload?.markmap || {};
      const derived = deriveOptions(frontmatter);

      const svg = document.getElementById('markmap');
      mm = Markmap.create(svg, {
        autoFit: true,
        fitRatio: 0.92,
        paddingX: 16,
        spacingHorizontal: 40,
        spacingVertical: 10,    // Reducido de 24 a 10 para hacer el mapa más compacto verticalmente
        duration: 400,
        initialExpandLevel: 2,  // start at level 2
        ...derived               // applies color fn, maxWidth, etc. from frontmatter
      }, root);
    });

    window.expandAll = function() {
      if (!mm || !originalRoot) return;
      try {
        // initialExpandLevel -1 means "never fold" in initializeData
        mm.setOptions({ initialExpandLevel: -1 });
        mm.setData(JSON.parse(JSON.stringify(originalRoot)));
        setTimeout(() => mm.fit(), 60);
      } catch(e) { console.error('expandAll error:', e); }
    };

    window.collapseAll = function() {
      if (!mm || !originalRoot) return;
      try {
        // Restore fold at level 2
        mm.setOptions({ initialExpandLevel: 2 });
        mm.setData(JSON.parse(JSON.stringify(originalRoot)));
        setTimeout(() => mm.fit(), 60);
      } catch(e) { console.error('collapseAll error:', e); }
    };

    window.saveAsPNG = function() {
      const btn = document.getElementById('btnSave');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Generando...';
      
      const uiElements = document.querySelectorAll('.glass-panel');
      uiElements.forEach(el => el.style.display = 'none');

      // Expandimos todo para que el PNG salga completo
      mm.setOptions({ initialExpandLevel: -1 });
      mm.setData(JSON.parse(JSON.stringify(originalRoot)));

      setTimeout(() => {
        const svgEl = document.getElementById('markmap');
        const g = svgEl.querySelector('g');
        
        // Obtenemos el tamaño real del mapa desplegado al 100%
        const bbox = g.getBBox();
        const padding = 100;
        const realWidth = Math.ceil(bbox.width + padding * 2);
        const realHeight = Math.ceil(bbox.height + padding * 2);

        // Guardamos los estilos originales
        const oldW = svgEl.style.width || '';
        const oldH = svgEl.style.height || '';

        // Forzamos al SVG a tener el tamaño exacto del mapa para que renderice 1:1
        svgEl.style.width = realWidth + 'px';
        svgEl.style.height = realHeight + 'px';

        mm.fit().then(() => {
          setTimeout(() => {
            // En lugar de quitar audios (ya no hay <audio>), solo capturamos el SVG
            htmlToImage.toPng(svgEl, { 
              backgroundColor: '#ffffff',
              width: realWidth,
              height: realHeight,
              pixelRatio: 2, // Resolución excelente a escala real
              style: {
                margin: '0',
                padding: '0'
              },
              filter: (node) => {
                if (node.tagName === 'IMG' && node.id && node.id.includes('community_highlight')) return false;
                if (node.src && typeof node.src === 'string' && node.src.startsWith('chrome-extension://')) return false;
                return true;
              }
            })
            .then(function (dataUrl) {
              const link = document.createElement('a');
              link.download = 'Mapa_Evaluacion_Educativa.png';
              link.href = dataUrl;
              link.click();

              // Restaurar SVG y UI
              svgEl.style.width = oldW;
              svgEl.style.height = oldH;
              uiElements.forEach(el => el.style.display = '');
              
              btn.innerHTML = originalText;
              mm.setOptions({ initialExpandLevel: 2 });
              mm.setData(JSON.parse(JSON.stringify(originalRoot)));
              setTimeout(() => mm.fit(), 60);
            })
            .catch(function (error) {
              console.error('Error capturando el mapa:', error);
              // Restaurar si falla
              svgEl.style.width = oldW;
              svgEl.style.height = oldH;
              uiElements.forEach(el => el.style.display = '');
              
              btn.innerHTML = '❌ Error';
              setTimeout(() => btn.innerHTML = originalText, 2000);
            });
          }, 400); // Dar un poco más de tiempo para asentar el fit()
        });
      }, 600);
    };
  </script>
